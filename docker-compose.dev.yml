# Local/dev: Postgres only. Run web + bot on the host with pnpm.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wc3dd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wc3dd}
      POSTGRES_DB: ${POSTGRES_DB:-wc3dd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wc3dd} -d ${POSTGRES_DB:-wc3dd}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
